name: Benchmark

on:
  workflow_dispatch:
    inputs:
      folders:
        description: Number of folders
        default: "2000"
      per_folder:
        description: Files per folder
        default: "50"

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release --locked --bin hikae
      - name: Measure
        shell: bash
        env:
          FOLDERS: ${{ inputs.folders || '2000' }}
          PER_FOLDER: ${{ inputs.per_folder || '50' }}
          PYTHONUTF8: "1"
        run: python scripts/bench.py target/release/hikae "$FOLDERS" "$PER_FOLDER"
