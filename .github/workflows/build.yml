name: Build

# Every push is checked. Release builds are made only for a tag, or on request
# from the Actions tab. GitHub does not apply path filters to tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "COPYING"
      - ".github/ISSUE_TEMPLATE/**"
      - "google*.html"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "COPYING"
      - ".github/ISSUE_TEMPLATE/**"
      - "google*.html"
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: hayakagami-windows-x64
          - os: macos-latest
            artifact: hayakagami-macos-arm64
          - os: ubuntu-latest
            artifact: hayakagami-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        if: env.PACKAGE == 'true'
        with:
          python-version: "3.12"
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        env:
          HAYAKAGAMI_REQUIRE_USN: "1"
        run: cargo test --locked
      - name: Build
        if: env.PACKAGE == 'true'
        run: cargo build --release --locked
      - name: Package
        if: env.PACKAGE == 'true'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          for bin in hayakagami hayakagami-gui; do
            for file in "target/release/$bin" "target/release/$bin.exe"; do
              if [ -f "$file" ]; then cp "$file" "dist/${{ matrix.artifact }}/"; fi
            done
          done
          cp README.md README_JA.md LICENSE COPYING "dist/${{ matrix.artifact }}/"
          python scripts/third_party_notices.py "dist/${{ matrix.artifact }}/THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create archives
        working-directory: artifacts
        run: for dir in */; do zip -qr "${dir%/}.zip" "$dir"; done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" artifacts/*.zip --repo "$REPO" --title "$TAG" --generate-notes
