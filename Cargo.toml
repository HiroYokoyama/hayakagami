[package]
name = "hayakagami"
version = "0.4.1"
edition = "2021"
rust-version = "1.95"
description = "Folder-based mirror backup that avoids rescanning the destination"
authors = ["HiroYokoyama"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/HiroYokoyama/hayakagami"
readme = "README.md"
default-run = "hayakagami"

[lib]
name = "hayakagami"
path = "src/lib.rs"

[[bin]]
name = "hayakagami"
path = "src/main.rs"

[[bin]]
name = "hayakagami-gui"
path = "src/bin/gui.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
globset = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
